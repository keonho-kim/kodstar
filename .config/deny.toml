# Purpose: Check dependency security, licenses and approved upstream sources.
# Pattern: Dependency Policy.
# Usage: cargo deny --config .config/deny.toml check.
# Related: LICENSES/dependencies.json, docs/development.md.

[advisories]
db-path = "${KODSTAR_ADVISORY_DB:-~/.cargo/advisory-dbs}"
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT",
    "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "Unlicense",
]

[licenses.private]
# The three unpublished workspace packages have no selected project license.
# External dependencies remain subject to the allowlist.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/RazrFalcon/roxmltree"]
