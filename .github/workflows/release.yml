# Purpose: Build, verify, and optionally publish the supported KodStar distributions.
# Pattern: Release Pipeline.
# Usage: Dispatch Release on main with publish enabled to create the workspace version's release.
# Related: scripts/release/toolchain.sh, scripts/release/package.py, docs/development.md.

name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified distributions from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kodstar-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    env:
      TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned native toolchain
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zstd libxml2-dev zlib1g-dev
          fi
          bash scripts/release/toolchain.sh "$TARGET" "$RUNNER_TEMP/kodstar-native"
          printf 'LLVM_CONFIG_PATH=%s\n' "$RUNNER_TEMP/kodstar-native/llvm/bin/llvm-config" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == macOS ]]; then
            printf 'KODSTAR_ZIG_LIB_PATH=%s\n' "$RUNNER_TEMP/kodstar-native/zig/lib" >> "$GITHUB_ENV"
          fi

      - name: Build distribution
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          host="$(rustup run "$toolchain" rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "$TARGET"
          rustup run "$toolchain" cargo build --locked --profile dist -p kodstar-cli

      - name: Verify and package distribution
        run: |
          python3 -B scripts/release/package.py target/dist/kodstar \
            "$RUNNER_TEMP/dist/kodstar-$TARGET.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kodstar-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/kodstar-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kodstar-*
          merge-multiple: true
          path: dist

      - name: Publish both verified archives and their checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          existing="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [[ -n "$existing" ]]; then
            printf 'Tag %s already exists.\n' "$tag" >&2
            exit 1
          fi
          cd dist
          archives=(kodstar-aarch64-apple-darwin.tar.gz kodstar-x86_64-unknown-linux-gnu.tar.gz)
          sha256sum "${archives[@]}" > SHA256SUMS
          gh release create "$tag" "${archives[@]}" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "KodStar $tag" --generate-notes \
            --notes 'Choose the archive for macOS Apple Silicon or Linux x86-64. Verify it against SHA256SUMS, extract it, and run `./install.sh --binary ./kodstar` from the extracted directory.'
