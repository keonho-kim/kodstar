# Purpose: Verify authored source, Rust builds, and the editor session adapter.
# Pattern: CI Workflow.
# Usage: GitHub Actions on pushes and pull requests.
# Related: scripts/check_source.py, Cargo.toml, editors/vscode/package.json.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Prepare pinned toolchain
        run: rustup toolchain install --no-self-update
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check source rules
        run: python3 scripts/check_source.py
      - name: Verify pinned grammar sources
        run: python3 scripts/generate_kotlin.py --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Prepare pinned toolchain
        run: rustup toolchain install --no-self-update
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install editor development dependencies
        working-directory: editors/vscode
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check editor formatting
        working-directory: editors/vscode
        run: npm run format:check
      - name: Test editor session adapter
        working-directory: editors/vscode
        run: npm test
